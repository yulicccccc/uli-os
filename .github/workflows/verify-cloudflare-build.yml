name: Cloudflare Build Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-cloudflare-build.yml"
      - "apps/web/**"
      - "packages/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile

      - name: Run Cognitive Core regression tests
        run: pnpm test

      - name: Build Cloudflare Worker through OpenNext
        run: pnpm --filter @uli-os/web cf:build

      - name: Record verification summary
        shell: bash
        run: |
          {
            echo "## Cloudflare build verification"
            echo
            echo "- Cognitive Core tests: passed"
            echo "- Next.js production build: passed"
            echo "- OpenNext Worker bundle: passed"
            echo "- Commit: ${GITHUB_SHA}"
            echo
            echo "Deployment is performed by Cloudflare Workers Builds after the repository is connected in the Cloudflare dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
