name: Bootstrap source snapshot

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and verify snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* > /tmp/uli-os-source.tar.gz.b64
          base64 --decode /tmp/uli-os-source.tar.gz.b64 > /tmp/uli-os-source.tar.gz
          echo "2cdf93e89e33fc2b28c6f2cf60015ee758fda5dabef6027ba424ccd4058eee6f  /tmp/uli-os-source.tar.gz" | sha256sum --check --strict

      - name: Restore tracked source files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/uli-os-source.tar.gz -C .
          rm -rf .bootstrap

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Uli OS v0.1 source snapshot"
          git push origin HEAD:main
