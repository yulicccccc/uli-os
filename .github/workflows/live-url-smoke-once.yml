name: Live URL Smoke Test Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-url-smoke-once.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify production URL
        shell: bash
        run: |
          set -euo pipefail
          url="https://uli-os-web.flint-oak.workers.dev/"
          body_file="/tmp/uli-os.html"
          status=$(curl --fail-with-body --location --silent --show-error \
            --retry 3 --retry-delay 2 \
            --output "$body_file" --write-out '%{http_code}' "$url")
          test "$status" = "200"
          grep -q "Uli OS" "$body_file"
          grep -q "让经历通过证据" "$body_file"
          title=$(grep -o '<title>[^<]*</title>' "$body_file" | head -1 | sed -E 's#</?title>##g' || true)
          {
            echo "# Live URL Smoke Test"
            echo
            echo "- Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- URL: $url"
            echo "- HTTP status: $status"
            echo "- Uli OS marker: present"
            echo "- Chinese marker: present"
            echo "- HTML title: ${title:-not captured}"
            echo "- Result: PASS"
          } > LIVE_URL_SMOKE.md

      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_URL_SMOKE.md
          git commit -m "test: record production URL smoke-test evidence"
          git push origin HEAD:main
