name: Cloudflare Temporary Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-temporary-deploy.yml"
      - "apps/web/**"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install, test, build, and deploy
        id: deploy
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash -o pipefail -c '
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@10.14.0 --activate
            pnpm install --no-frozen-lockfile
            pnpm test
            pnpm --filter @uli-os/web cf:build
            cd apps/web
            pnpm exec wrangler deploy --temporary
          ' 2>&1 | tee /tmp/cloudflare-deploy.raw.txt
          deploy_exit=${PIPESTATUS[0]}
          set -e

          sed -E 's/\x1B\[[0-9;]*[mK]//g' /tmp/cloudflare-deploy.raw.txt > CLOUDFLARE_TEMP_DEPLOYMENT.txt
          deployment_url=$(grep -Eo 'https://[^[:space:]]+workers\.dev[^[:space:]]*' CLOUDFLARE_TEMP_DEPLOYMENT.txt | tail -1 || true)
          claim_url=$(grep -Eo 'https://dash\.cloudflare\.com/[^[:space:]]+' CLOUDFLARE_TEMP_DEPLOYMENT.txt | tail -1 || true)

          {
            echo "# Cloudflare Temporary Deployment Evidence"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Exit code: ${deploy_exit}"
            echo "- Generated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -n "$deployment_url" ]; then echo "- Deployment URL: ${deployment_url}"; fi
            if [ -n "$claim_url" ]; then echo "- Claim URL: ${claim_url}"; fi
            echo
            echo "The raw command output is stored in \`CLOUDFLARE_TEMP_DEPLOYMENT.txt\`."
          } > CLOUDFLARE_TEMP_DEPLOYMENT.md

          echo "deploy_exit=${deploy_exit}" >> "$GITHUB_OUTPUT"

      - name: Commit lockfile and deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated files or evidence to commit."
          else
            git commit -m "deploy: record Cloudflare temporary deployment evidence"
            git push origin HEAD:main
          fi

      - name: Fail if deployment failed
        if: steps.deploy.outputs.deploy_exit != '0'
        shell: bash
        run: |
          echo "Cloudflare temporary deployment failed. See CLOUDFLARE_TEMP_DEPLOYMENT.txt in the repository."
          exit 1
