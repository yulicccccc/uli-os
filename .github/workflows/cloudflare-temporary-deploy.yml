name: Cloudflare Temporary Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-temporary-deploy.yml"
      - "apps/web/**"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy temporary Cloudflare preview
        id: deploy
        shell: bash
        run: |
          set -uo pipefail
          cd apps/web
          set +e
          npx --yes wrangler@latest deploy --temporary --yes 2>&1 | tee /tmp/cloudflare-deploy.log
          deploy_exit=${PIPESTATUS[0]}
          set -e
          cd ../..

          cp /tmp/cloudflare-deploy.log CLOUDFLARE_TEMP_DEPLOYMENT.log
          {
            echo "# Cloudflare Temporary Deployment Evidence"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Exit code: ${deploy_exit}"
            echo "- Generated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "The raw command output is stored in \`CLOUDFLARE_TEMP_DEPLOYMENT.log\`."
          } > CLOUDFLARE_TEMP_DEPLOYMENT.md

          echo "deploy_exit=${deploy_exit}" >> "$GITHUB_OUTPUT"

      - name: Commit deployment evidence and generated config
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated files or evidence to commit."
          else
            git commit -m "deploy: record Cloudflare temporary deployment evidence"
            git push origin HEAD:main
          fi

      - name: Fail if deployment failed
        if: steps.deploy.outputs.deploy_exit != '0'
        shell: bash
        run: |
          echo "Cloudflare temporary deployment failed. See CLOUDFLARE_TEMP_DEPLOYMENT.log in the repository."
          exit 1
